services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stock_market
      POSTGRES_USER: stock_user
      POSTGRES_PASSWORD: stock_pass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock_user -d stock_market"]
      interval: 10s
      timeout: 5s
      retries: 5
  app:
    build: .
    environment:
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/stock_market
      - SPRING_DATASOURCE_USERNAME=stock_user
      - SPRING_DATASOURCE_PASSWORD=stock_pass
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"
    restart: always
  nginx:
    image: nginx:alpine
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    restart: always